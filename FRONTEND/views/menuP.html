<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Gallos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1810 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Arial Black', sans-serif;
        }

        .container-custom {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: auto auto auto;
            gap: 20px;
            width: 90%;
            max-width: 1200px;
        }

        .user-data-box {
            border: 4px solid #d4621f;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(212, 98, 31, 0.6);
        }

        .user-data-box h4 {
            color: #ff6b35;
            font-size: 1.8rem;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            margin-bottom: 15px;
        }

        .user-data-box p {
            color: #d4621f;
            font-size: 1.3rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin: 0;
        }

        .gallos-section {
            border: 4px solid #d4621f;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 60px;
            grid-column: 1 / 2;
            grid-row: 2 / 3;
            min-height: 80px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 10px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(212, 98, 31, 0.6);
        }

        .gallo-image {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.8em;
        }

        .gallo img {
            width: 100px;
            height: 100px;
            transition: transform 0.3s;
        }

        .gallo img:hover {
            transform: scale(1.1);
        }

        .edit-team-section {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
            align-self: end;
            margin-top: 180px;
            width: fit-content;
            justify-self: center;
        }

        .play-section {
            border: 4px solid #d4621f;
            background: rgba(0, 0, 0, 0.85);
            grid-column: 1 / 2;
            grid-row: 3 / 4;
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(212, 98, 31, 0.6);
        }

        .ranking-section {
            border: 4px solid #d4621f;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            grid-column: 2 / 3;
            grid-row: 1 / 4;
            min-height: 600px;
            margin-left: 20px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(212, 98, 31, 0.6);
        }

        .ranking-section h3 {
            color: #ff6b35;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .modal-dialog-scrollable .modal-body {
            max-height: 300px;
        }

        .mi-navbar {
            display: flex;
            justify-content: center;
            background: linear-gradient(180deg, rgba(212, 98, 31, 0.9) 0%, rgba(61, 36, 21, 0.9) 100%);
            border-bottom: 5px solid #d4621f;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .center_in_navbar {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        .nav-img {
            margin-right: 5px;
        }

        .button {
            margin-top: 5px;
            color: white;
            background: linear-gradient(135deg, #d4621f 0%, #ff6b35 100%);
            padding: 8px 10px;
            text-shadow: black 0px -1px 0;
            border-radius: 12px;
            text-decoration: none;
            display: inline-block;
            font-family: 'Arial Black', sans-serif;
            font-size: 11pt;
            cursor: pointer;
            border: none;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(212, 98, 31, 0.5);
            text-transform: uppercase;
        }

        .button:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.7);
            background: linear-gradient(135deg, #ff6b35 0%, #d4621f 100%);
            color: white;
        }

        .no_border {
            border: none;
            margin: 0;
            padding: 0;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4621f 0%, #ff6b35 100%);
            border: none;
            padding: 15px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(212, 98, 31, 0.5);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.7);
            background: linear-gradient(135deg, #ff6b35 0%, #d4621f 100%);
        }

        .btn-danger {
            background: linear-gradient(135deg, #8b0000 0%, #ff0000 100%);
            border: none;
            padding: 18px;
            font-size: 1.8rem;
            font-weight: bold;
            border-radius: 12px;
            width: 100%;
            height: 100%;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(139, 0, 0, 0.5);
            color: white;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-danger:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.7);
            background: linear-gradient(135deg, #ff0000 0%, #8b0000 100%);
            color: white;
        }

        .btn-logout {
            background: linear-gradient(135deg, #8b0000 0%, #dc143c 100%);
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(139, 0, 0, 0.5);
            color: white;
        }

        .btn-logout:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(220, 20, 60, 0.7);
            background: linear-gradient(135deg, #dc143c 0%, #8b0000 100%);
        }

        .table-dark {
            background: rgba(61, 36, 21, 0.8);
            border: 3px solid #d4621f;
            border-radius: 10px;
        }

        .table-dark thead th {
            color: #ff6b35;
            border-color: #d4621f;
            font-size: 1.1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .table-dark tbody td,
        .table-dark tbody th {
            color: #d4621f;
            border-color: rgba(212, 98, 31, 0.3);
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(61, 36, 21, 0.5);
        }

        .modal-content {
            background: rgba(0, 0, 0, 0.95) !important;
            border: 4px solid #d4621f !important;
            border-radius: 20px !important;
            box-shadow: 0 0 40px rgba(212, 98, 31, 0.6) !important;
        }

        .modal-header {
            border-bottom: 3px solid #d4621f;
        }

        .modal-title {
            color: #ff6b35;
            font-size: 1.5rem;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
        }

        .modal-footer {
            border-top: 3px solid #d4621f;
        }

        .form-label {
            color: #ff6b35;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .form-control {
            background: rgba(61, 36, 21, 0.8);
            border: 3px solid #d4621f;
            color: white;
            border-radius: 10px;
        }

        .form-control:focus {
            background: rgba(61, 36, 21, 0.9);
            border-color: #ff6b35;
            color: white;
            box-shadow: 0 0 15px rgba(255, 107, 53, 0.4);
        }

        .list-group-item {
            background: rgba(61, 36, 21, 0.8) !important;
            border: 2px solid #d4621f !important;
            color: #ff6b35 !important;
            margin-bottom: 5px;
            border-radius: 10px !important;
        }

        .list-group-item:hover {
            background: rgba(61, 36, 21, 0.95) !important;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #3d2415 0%, #5a3620 100%);
            border: 3px solid #d4621f;
            color: #d4621f;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-secondary:hover {
            background: linear-gradient(135deg, #5a3620 0%, #3d2415 100%);
            color: #ff6b35;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-sm navbar-dark mi-navbar justify-content-center fixed-top" style="padding: 0;">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="button" data-bs-toggle="modal" data-bs-target="#modalEditUser">Usuario</a>
            </li>
        </ul>
        <img class="no_border nav-img" src="/Assets/interface/cockFighterTitulo.png" width="187" height="56">
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="button" href="./../tienda.html">Tienda</a>
            </li>
        </ul>

    <div class="modal fade modalB" id="modalEditUser" tabindex="-1">

    <div class="container-custom">
        <div class="user-data-box">
            <h4 id="displayUsername">Nombre de Usuario: --</h4>
            <p id="displayRanking">Ranking Global: #-</p>
        </div>

        <div class="gallos-section">
            <div class="gallo img">
                <img id="galloPrincipal" src="https://images.emojiterra.com/google/noto-emoji/unicode-16.0/color/512px/2753.png" alt="gallo 1">
            </div>
            <div class="gallo img">
                <img id="galloSecondary" src="https://images.emojiterra.com/google/noto-emoji/unicode-16.0/color/512px/2753.png" alt="gallo 2">
            </div>

        </div>

        <div class="edit-team-section">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#editTeamModal">
                Editar Equipo
            </button>
            <button type="button" class="btn btn-secondary ms-2" id="changeFondoBtn" data-bs-toggle="modal" data-bs-target="#changeFondoModal">
                Cambiar Fondo
            </button>

            <div class="modal fade" id="editTeamModal" tabindex="-1" aria-labelledby="editTeamModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="editTeamModalLabel">Seleccionar Gallos (Exactamente 2)</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <ul id="gallosList" class="list-group">
                                <!-- Lista de gallos se popula dinámicamente desde /api/gallos -->
                            </ul>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                            <button id="saveSelectionBtn" type="button" class="btn btn-primary">Guardar Selección</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modal Cambiar Fondo -->
        <div class="modal fade" id="changeFondoModal" tabindex="-1" aria-labelledby="changeFondoModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="changeFondoModalLabel">Cambiar Fondo</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p class="form-label">Elige uno de tus fondos comprados o la opción por defecto:</p>
                        <ul id="fondosList" class="list-group mb-3">
                            <!-- Fondos se cargarán dinámicamente -->
                        </ul>

                        <div style="text-align:center;">
                            <p class="form-label">Previsualización:</p>
                            <div id="fondoPreview" style="width:100%;height:160px;border:2px solid #d4621f;border-radius:10px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#d4621f;">Default</div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <button id="saveFondoBtn" type="button" class="btn btn-primary">Guardar Fondo</button>
                    </div>
                </div>
            </div>

        <div class="play-section">
            <a type="button" id="playBtn" class="btn btn-danger" href="game.html">jugar</a>
        </div>

        <div class="ranking-section">
            <h3>Ranking Global</h3>
            <table class="table table-dark table-striped">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Usuario</th>
                        <th scope="col">Puntos</th>
                    </tr>
                </thead>
                <tbody id="rankingBody">
                    <!-- Ranking dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        window.selectedFondoRoute = null;

       document.addEventListener('DOMContentLoaded', async () => {
            const gallosList = document.getElementById('gallosList');
            const mainGalloImgs = document.querySelectorAll('.gallos-section .gallo img');
            const saveBtn = document.getElementById('saveSelectionBtn');

            // obtener ID del usuario desde localStorage (se guarda en login.html)
            const userId = localStorage.getItem('userId');

            // mantener datos y orden de selección
            let misGallosGlobal = [];
            const selectedOrder = []; // guardará índices en el orden que fueron seleccionados

            try {
                const respuesta = await fetch('/api/gallos');
                misGallosGlobal = await respuesta.json();

                // Si no hay gallos, mostramos mensaje
                if (!Array.isArray(misGallosGlobal) || misGallosGlobal.length === 0) {
                    gallosList.innerHTML = '<li class="list-group-item">No hay gallos disponibles</li>';
                    return;
                }

                // Cargar equipo guardado del usuario
                let savedGallos = [];
                if (userId) {
                    try {
                        const teamRes = await fetch(`/api/auth/team/${userId}`);
                        if (teamRes.ok) {
                            const teamData = await teamRes.json();
                            savedGallos = teamData.gallos || [];
                        }
                    } catch (teamErr) {
                        console.warn('No se pudo cargar el equipo guardado:', teamErr);
                    }
                }

                // Poblar la lista dinámicamente
                gallosList.innerHTML = '';
                misGallosGlobal.forEach((gallo, index) => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex align-items-center';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.className = 'form-check-input me-2';
                    checkbox.id = `gallo_chk_${index}`;
                    checkbox.dataset.index = index;
                    checkbox.dataset.galloId = gallo._id; // guardar ID del gallo

                    const thumb = document.createElement('img');
                    const spritePath = (gallo.sprites && (gallo.sprites.spriteFront || gallo.sprites.spriteBack)) || '/Assets/interface/cockFighterTitulo.png';
                    thumb.src = spritePath;
                    thumb.alt = gallo.nombre || 'gallo';
                    thumb.style.width = '32px';
                    thumb.style.height = '32px';
                    thumb.style.objectFit = 'cover';
                    thumb.style.marginRight = '12px';
                    thumb.style.cursor = 'pointer';

                    const label = document.createElement('label');
                    label.className = 'form-check-label mb-0 flex-grow-1';
                    label.htmlFor = checkbox.id;
                    label.textContent = gallo.nombre || `Gallo ${index+1}`;

                    // store sprite path and index on li for easy access
                    li.dataset.sprite = spritePath;
                    li.dataset.index = index;
                    li.appendChild(checkbox);
                    li.appendChild(thumb);
                    li.appendChild(label);

                    // Si este gallo está en savedGallos, marcarlo y añadirlo a selectedOrder
                    if (savedGallos.includes(gallo._id)) {
                        checkbox.checked = true;
                        selectedOrder.push(index);
                        li.classList.add('selected');
                    }

                    // Preview al hacer click en la miniatura (no cambia selección)
                    thumb.addEventListener('click', () => {
                        if (mainGalloImgs.length > 0) mainGalloImgs[0].src = li.dataset.sprite;
                    });

                    // Manejar selección: exactamente 2 (min y max). Mantener orden de selección.
                    checkbox.addEventListener('change', (evt) => {
                        const idx = Number(evt.target.dataset.index);

                        if (evt.target.checked) {
                            // si ya hay 2 seleccionados, no permitimos más
                            if (selectedOrder.length >= 2) {
                                evt.target.checked = false;
                                alert('Solo puedes seleccionar exactamente 2 gallos.');
                                return;
                            }
                            // añadir al orden
                            selectedOrder.push(idx);
                            li.classList.add('selected');
                        } else {
                            // remover del orden si se desmarca
                            const pos = selectedOrder.indexOf(idx);
                            if (pos !== -1) selectedOrder.splice(pos, 1);
                            li.classList.remove('selected');
                        }

                        // Actualizar vista previa: primer seleccionado -> primario, segundo -> secundario
                        if (mainGalloImgs.length > 0) {
                            if (selectedOrder[0] !== undefined) {
                                const s0 = misGallosGlobal[selectedOrder[0]];
                                const s0path = (s0.sprites && (s0.sprites.spriteFront || s0.sprites.spriteBack)) || mainGalloImgs[0].src;
                                mainGalloImgs[0].src = s0path;
                            }
                            if (selectedOrder[1] !== undefined && mainGalloImgs[1]) {
                                const s1 = misGallosGlobal[selectedOrder[1]];
                                const s1path = (s1.sprites && (s1.sprites.spriteFront || s1.sprites.spriteBack)) || mainGalloImgs[1].src;
                                mainGalloImgs[1].src = s1path;
                            } else if (mainGalloImgs[1]) {
                                // si no hay segundo seleccionado, dejar fallback
                                // no cambiar si ya tenía algo
                            }
                        }
                    });

                    gallosList.appendChild(li);
                });

                // Mostrar los gallos guardados en las imágenes principales
                const playBtn = document.getElementById('playBtn');
                if (savedGallos.length >= 2) {
                    // Buscar los objetos de gallos por sus IDs
                    const primary = misGallosGlobal.find(g => g._id === savedGallos[0]);
                    const secondary = misGallosGlobal.find(g => g._id === savedGallos[1]);

                    if (primary && mainGalloImgs[0]) {
                        const primaryPath = (primary.sprites && (primary.sprites.spriteFront || primary.sprites.spriteBack)) || mainGalloImgs[0].src;
                        mainGalloImgs[0].src = primaryPath;
                    }
                    if (secondary && mainGalloImgs[1]) {
                        const secondaryPath = (secondary.sprites && (secondary.sprites.spriteFront || secondary.sprites.spriteBack)) || mainGalloImgs[1].src;
                        mainGalloImgs[1].src = secondaryPath;
                    }
                    // Habilitar botón jugar si hay equipo completo
                    playBtn.style.pointerEvents = 'auto';
                    playBtn.style.opacity = '1';
                    playBtn.disabled = false;
                } else {
                    // Si no hay equipo guardado, mostrar el emoji (src original)
                    const defaultEmojiSrc = 'https://images.emojiterra.com/google/noto-emoji/unicode-16.0/color/512px/2753.png';
                    if (mainGalloImgs[0]) mainGalloImgs[0].src = defaultEmojiSrc;
                    if (mainGalloImgs[1]) mainGalloImgs[1].src = defaultEmojiSrc;

                    // Deshabilitar botón jugar si no hay equipo
                    playBtn.style.pointerEvents = 'none';
                    playBtn.style.opacity = '0.5';
                    playBtn.disabled = true;
                }

                // Guardar selección: aplicar solo si hay exactamente 2 seleccionados
                saveBtn.addEventListener('click', async () => {
                    if (selectedOrder.length !== 2) {
                        alert('Debes seleccionar exactamente 2 gallos (primario y secundario).');
                        return;
                    }

                    const primary = misGallosGlobal[selectedOrder[0]];
                    const secondary = misGallosGlobal[selectedOrder[1]];
                    const pPath = (primary.sprites && (primary.sprites.spriteFront || primary.sprites.spriteBack)) || mainGalloImgs[0].src;
                    const sPath = (secondary.sprites && (secondary.sprites.spriteFront || secondary.sprites.spriteBack)) || mainGalloImgs[1].src;

                    if (mainGalloImgs[0]) mainGalloImgs[0].src = pPath;
                    if (mainGalloImgs[1]) mainGalloImgs[1].src = sPath;

                    // Habilitar botón jugar cuando se guarda un equipo válido
                    const playBtn = document.getElementById('playBtn');
                    playBtn.style.pointerEvents = 'auto';
                    playBtn.style.opacity = '1';
                    playBtn.disabled = false;

                    // Guardar en la BD si hay userId
                    if (userId) {
                        try {
                            const gallosIds = [primary._id, secondary._id];
                            const saveRes = await fetch(`/api/auth/team/${userId}`, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ gallos: gallosIds })
                            });

                            if (saveRes.ok) {
                                console.log('Equipo guardado en la BD');
                            } else {
                                console.error('Error al guardar equipo:', await saveRes.text());
                            }
                        } catch (saveErr) {
                            console.error('Error al enviar equipo al servidor:', saveErr);
                        }
                    }

                    // cerrar modal
                    const modalEl = document.getElementById('editTeamModal');
                    const modalInstance = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                    modalInstance.hide();
                });

            } catch (error) {
                console.error('Error trayendo al gallo:', error);
                gallosList.innerHTML = '<li class="list-group-item">Error cargando gallos</li>';
            }
        });

        // ------------------ Cambiar Fondo (nuevo) ------------------
        document.addEventListener('DOMContentLoaded', async () => {
            const userId = localStorage.getItem('userId');
            const fondosList = document.getElementById('fondosList');
            const fondoPreview = document.getElementById('fondoPreview');
            const saveFondoBtn = document.getElementById('saveFondoBtn');

            const assetForKey = (key) => {
                const map = {
                    nevado: '/Assets/FONDO_nevado.jpg',
                    kfc: '/Assets/FONDO_kfc.jpg',
                    pradera: '/Assets/FONDO_pradera.jpg',
                    bosque: '/Assets/FONDO_bosque.jpg',
                    desierto: '/Assets/FONDO_desierto.jpg',
                    selva: '/Assets/FONDO_selva.jpg'
                };
                return map[key] || '';
            };


            const applyFondo = (key) => {
                if (!key || key === 'default') {
                    fondoPreview.textContent = 'Default';
                    fondoPreview.style.backgroundImage = '';
                    fondoPreview.style.backgroundSize = '';
                    fondoPreview.style.backgroundRepeat = '';
                    fondoPreview.style.backgroundPosition = '';
                    localStorage.selectedFondoRoute = null;  // ← Guarda null para default
                    console.log('Fondo seleccionado: Default (null)');
                } else {
                    const url = assetForKey(key);
                    if (url) {
                        fondoPreview.textContent = '';
                        fondoPreview.style.backgroundImage = `url('${url}')`;
                        fondoPreview.style.backgroundSize = 'cover';
                        fondoPreview.style.backgroundRepeat = 'no-repeat';
                        fondoPreview.style.backgroundPosition = 'center';
                        localStorage.selectedFondoRoute = url;  // ← Guarda la ruta en la variable global
                        console.log('Fondo seleccionado:', url);
                    } else {
                        fondoPreview.textContent = key;
                        fondoPreview.style.backgroundImage = '';
                        localStorage.selectedFondoRoute = null;
                        console.log('Fondo no encontrado:', key);
                    }
                }
            };

            // cargar fondos del usuario y selectedFondo
            async function loadFondos() {
                fondosList.innerHTML = '<li class="list-group-item">Cargando...</li>';
                if (!userId) {
                    fondosList.innerHTML = '<li class="list-group-item">Debes iniciar sesión para cambiar el fondo</li>';
                    saveFondoBtn.disabled = true;
                    return;
                }

                try {
                    const res = await fetch(`/api/auth/user/${userId}`);
                    if (!res.ok) {
                        fondosList.innerHTML = '<li class="list-group-item">Error al cargar fondos</li>';
                        return;
                    }
                    const userData = await res.json();
                    const fondos = userData.fondos || [];
                    const selected = userData.selectedFondo || 'default';

                    // construir lista: option default + compras
                    fondosList.innerHTML = '';

                    // Default option (radio)
                    const liDefault = document.createElement('li');
                    liDefault.className = 'list-group-item d-flex align-items-center';
                    liDefault.innerHTML = `
                        <input type="radio" name="fondo_choice" id="fondo_default" value="default" class="form-check-input me-2">
                        <label for="fondo_default" class="form-check-label mb-0 flex-grow-1">Default</label>
                    `;
                    fondosList.appendChild(liDefault);

                    // opciones compradas
                    if (fondos.length === 0) {
                        const li = document.createElement('li');
                        li.className = 'list-group-item';
                        li.textContent = 'No tienes fondos comprados.';
                        fondosList.appendChild(li);
                    } else {
                        fondos.forEach(key => {
                            const li = document.createElement('li');
                            li.className = 'list-group-item d-flex align-items-center';
                            const imgUrl = assetForKey(key);
                            li.innerHTML = `
                                <input type="radio" name="fondo_choice" id="fondo_${key}" value="${key}" class="form-check-input me-2">
                                <img src="${imgUrl}" alt="${key}" style="width:48px;height:48px;object-fit:cover;margin-right:12px;border-radius:6px;">
                                <label for="fondo_${key}" class="form-check-label mb-0 flex-grow-1">${key}</label>
                            `;
                            fondosList.appendChild(li);
                        });
                    }

                    // marcar seleccionado actual
                    const selInput = document.querySelector(`input[name='fondo_choice'][value='${selected}']`);
                    if (selInput) selInput.checked = true;
                    applyFondo(selected);

                    // listeners de cambio para preview
                    fondosList.querySelectorAll("input[name='fondo_choice']").forEach(r => {
                        r.addEventListener('change', (e) => {
                            applyFondo(e.target.value);
                        });
                    });

                } catch (err) {
                    console.error('Error cargando fondos:', err);
                    fondosList.innerHTML = '<li class="list-group-item">Error al cargar fondos</li>';
                }
            }

            // guardar fondo seleccionado
            saveFondoBtn.addEventListener('click', async () => {
                if (!userId) return alert('Debes iniciar sesión para guardar el fondo');
                const selectedInput = document.querySelector("input[name='fondo_choice']:checked");
                if (!selectedInput) return alert('Selecciona un fondo');
                const value = selectedInput.value;

                try {
                    const res = await fetch(`/api/auth/user/${userId}/fondo`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fondo: value })
                    });
                    if (!res.ok) {
                        const txt = await res.text();
                        console.error('Error guardando fondo:', txt);
                        alert('No se pudo guardar el fondo');
                        return;
                    }
                    const data = await res.json();
                    const fondoSaved = data.selectedFondo || value;

                    // Actualizar la variable global con la ruta del fondo seleccionado
                    if (fondoSaved === 'default' || !fondoSaved) {
                        window.selectedFondoRoute = null;
                        console.log('Fondo guardado en BD: Default (null)');
                    } else {
                        window.selectedFondoRoute = assetForKey(fondoSaved);
                        console.log('Fondo guardado en BD:', window.selectedFondoRoute);
                    }

                    // actualizar solo la previsualización del modal y cerrar (no tocar el fondo del menú principal)
                    applyFondo(fondoSaved);
                    const modalEl = document.getElementById('changeFondoModal');
                    const modalInstance = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                    modalInstance.hide();
                } catch (err) {
                    console.error(err);
                    alert('Error al guardar el fondo');
                }
            });

            // cuando se abre el modal, recargar la lista para tener datos frescos
            const changeFondoModalEl = document.getElementById('changeFondoModal');
            changeFondoModalEl.addEventListener('show.bs.modal', loadFondos);
        });

        function logout() {
            window.location.href = 'login.html';
        }
    </script>

    <script>
        // Gestión de puntuación del usuario
        async function addPointsToCurrentUser(delta) {
            const userId = localStorage.getItem('userId');

            if (!userId) {
                console.warn('No hay usuario en sesión');
                return false;
            }

            if (typeof delta !== 'number') {
                console.warn('delta debe ser un número');
                return false;
            }

            try {
                // Obtener puntos actuales del usuario
                const userRes = await fetch(`/api/auth/user/${userId}`);
                if (!userRes.ok) {
                    console.error('Error obteniendo usuario actual');
                    return false;
                }
                const user = await userRes.json();
                const currentScore = user.score || 0;

                // Calcular nuevo score
                const newScore = Math.max(0, currentScore + delta);

                // Enviar al backend
                const res = await fetch(`/api/auth/user/${userId}/score`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ score: newScore })
                });

                if (!res.ok) {
                    console.error('Error guardando puntuación:', await res.text());
                    return false;
                }

                const updatedUser = await res.json();
                console.log(`Puntos actualizados: ${currentScore} + ${delta} = ${updatedUser.score}`);

                // Disparar evento para recargar ranking
                const event = new Event('pointsUpdated');
                window.dispatchEvent(event);

                return true;
            } catch (err) {
                console.error('Error en addPointsToCurrentUser:', err);
                return false;
            }
        }

        // Cargar usuario y ranking
        const rankingModule = (function () {
            const userId = localStorage.getItem('userId');
            const displayUsername = document.getElementById('displayUsername');
            const displayRanking = document.getElementById('displayRanking');
            const rankingBody = document.getElementById('rankingBody');

            async function loadUser() {
                if (!userId) return;
                try {
                    const res = await fetch(`/api/auth/user/${userId}`);
                    if (!res.ok) return console.warn('No se pudo obtener usuario');
                    const user = await res.json();
                    displayUsername.textContent = `Nombre de Usuario: ${user.username || '--'}`;
                } catch (err) {
                    console.error('Error cargando usuario:', err);
                }
            }

            //función para la carga del ranking
            async function loadRanking() {
                try {
                    const res = await fetch('/api/auth/ranking?limit=10');
                    if (!res.ok) return console.warn('No se pudo cargar ranking');
                    const list = await res.json();
                    rankingBody.innerHTML = '';
                    list.forEach((u, idx) => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <th scope="row">${idx + 1}</th>
                            <td>${u.username || '—'}</td>
                            <td>${u.score || 0}</td>
                        `;
                        rankingBody.appendChild(tr);
                    });

                    // si el usuario está en la lista, mostrar su puesto
                    if (userId) {
                        const idx = list.findIndex(u => String(u._id) === String(userId) || u._id === userId);
                        if (idx !== -1) displayRanking.textContent = `Ranking Global: #${idx + 1}`;
                        else displayRanking.textContent = `Ranking Global: #${list.length >= 10 ? '>' + list.length : list.length}`;
                    }
                } catch (err) {
                    console.error('Error cargando ranking:', err);
                }
            }

            // función para incrementar puntos del usuario actual
            async function addPointsToCurrentUser(points) {
                if (!userId) {
                    console.warn('No hay usuario en sesión');
                    return false;
                }
                if (typeof points !== 'number') {
                    console.warn('points debe ser un número');
                    return false;
                }
                try {
                    const res = await fetch(`/api/auth/user/${userId}/score/inc`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ delta: points })
                    });
                    if (!res.ok) {
                        console.error('Error incrementando puntos:', await res.text());
                        return false;
                    }
                    const updatedUser = await res.json();
                    console.log('Puntos actualizados. Nuevo score:', updatedUser.score);
                    // recargar ranking para reflejar cambios
                    await loadRanking();
                    await loadUser();
                    return true;
                } catch (err) {
                    console.error('Error en addPointsToCurrentUser:', err);
                    return false;
                }
            }

            // inicializar
            document.addEventListener('DOMContentLoaded', async () => {
                await loadUser();
                await loadRanking();
            });

            // exponer funciones necesarias
            return {
                addPointsToCurrentUser,
                loadRanking,
                loadUser
            };
        })();

        // hacer accesible globalmente
        window.addPointsToCurrentUser = rankingModule.addPointsToCurrentUser;
    </script>

    <script>
        // Manejo del modal Editar Usuario: cargar datos y guardar cambios
        (function () {
            const saveBtn = document.getElementById('saveUserBtn');
            const form = document.getElementById('formEditUser');
            const editName = document.getElementById('editName');
            const editEmail = document.getElementById('editEmail');
            const editPassword = document.getElementById('editPassword');
            const modalEl = document.getElementById('modalEditUser');

            // Al abrir el modal, cargar datos actuales del usuario
            modalEl.addEventListener('show.bs.modal', async () => {
                const userId = localStorage.getItem('userId');
                if (!userId) return;
                try {
                    const res = await fetch(`/api/auth/user/${userId}`);
                    if (!res.ok) return;
                    const user = await res.json();
                    editName.value = user.username || '';
                    editEmail.value = user.email || '';
                    editPassword.value = '';
                } catch (err) {
                    console.error('Error cargando usuario en modal:', err);
                }
            });

            // Guardar cambios
            saveBtn.addEventListener('click', async () => {
                const userId = localStorage.getItem('userId');
                if (!userId) return alert('Debes iniciar sesión para editar el usuario');

                const payload = {
                    username: editName.value.trim(),
                    email: editEmail.value.trim()
                };
                if (editPassword.value && editPassword.value.length > 0) payload.password = editPassword.value;

                try {
                    const res = await fetch(`/api/auth/user/${userId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) {
                        const txt = await res.text();
                        console.error('Error al actualizar usuario:', txt);
                        return alert('No se pudieron guardar los cambios: ' + txt);
                    }
                    const updated = await res.json();
                    // actualizar UI
                    const displayUsername = document.getElementById('displayUsername');
                    displayUsername.textContent = `Nombre de Usuario: ${updated.username}`;

                            // recargar ranking y usuario visibles
                            try {
                                if (rankingModule && typeof rankingModule.loadRanking === 'function') await rankingModule.loadRanking();
                                if (rankingModule && typeof rankingModule.loadUser === 'function') await rankingModule.loadUser();
                            } catch (e) {
                                console.warn('No se pudo recargar ranking tras actualizar usuario:', e);
                            }

                            // cerrar modal
                            const modalInstance = bootstrap.Modal.getInstance(modalEl) || new bootstrap.Modal(modalEl);
                            modalInstance.hide();
                            alert('Cambios guardados');
                } catch (err) {
                    console.error('Error guardando usuario:', err);
                    alert('Error guardando cambios');
                }
            });
        })();
    </script>
