<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallitos Fighters - Login/Registro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1810 100%);
            font-family: 'Arial Black', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .game-header {
            background: linear-gradient(180deg, rgba(212, 98, 31, 0.9) 0%, rgba(61, 36, 21, 0.9) 100%);
            padding: 20px 0;
            text-align: center;
            border-bottom: 5px solid #d4621f;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        }

        .game-title {
            color: #fff;
            font-size: 4rem;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.9);
            margin: 0;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .main-container {
            display: flex;
            min-height: calc(100vh - 160px);
            padding: 50px;
            gap: 50px;
            align-items: center;
            justify-content: center;
        }

        .info-section {
            flex: 1;
            max-width: 600px;
            color: white;
        }

        .welcome-text {
            font-size: 3rem;
            color: #ff6b35;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            margin-bottom: 30px;
            line-height: 1.2;
        }

        .description {
            font-size: 1.3rem;
            color: #d4621f;
            margin-bottom: 30px;
            line-height: 1.6;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .features-list {
            list-style: none;
            padding: 0;
            margin-top: 30px;
        }

        .features-list li {
            font-size: 1.2rem;
            color: #ff6b35;
            margin-bottom: 15px;
            padding-left: 40px;
            position: relative;
        }

        .form-section-container {
            flex: 1;
            max-width: 550px;
        }

        .login-card {
            background: rgba(0, 0, 0, 0.85);
            border: 4px solid #d4621f;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 0 40px rgba(212, 98, 31, 0.6);
        }

        .form-tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }

        .tab-btn {
            flex: 1;
            padding: 18px;
            background: #3d2415;
            border: 3px solid #d4621f;
            color: #d4621f;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 12px;
            font-size: 1.3rem;
            text-transform: uppercase;
        }

        .tab-btn:hover {
            background: #d4621f;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(212, 98, 31, 0.5);
        }

        .tab-btn.active {
            background: #d4621f;
            color: white;
            box-shadow: 0 0 20px rgba(212, 98, 31, 0.8);
        }

        .form-section { display: none; }
        .form-section.active { display: block; }

        .form-label {
            color: #ff6b35;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .form-control {
            background: rgba(61, 36, 21, 0.8);
            border: 3px solid #d4621f;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 1.1rem;
        }

        .form-control:focus {
            background: rgba(61, 36, 21, 0.9);
            border-color: #ff6b35;
            color: white;
            box-shadow: 0 0 15px rgba(255, 107, 53, 0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4621f 0%, #ff6b35 100%);
            border: none;
            padding: 18px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 12px;
            width: 100%;
            margin-top: 15px;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 5px 20px rgba(212, 98, 31, 0.5);
            cursor: pointer;
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.7);
        }

        .alert {
            border-radius: 12px;
            border: 3px solid;
            margin-bottom: 25px;
            padding: 15px;
            font-size: 1.1rem;
        }

        .alert-danger {
            background: rgba(139, 0, 0, 0.3);
            border-color: #8b0000;
            color: #ff6b6b;
        }

        .alert-success {
            background: rgba(0, 100, 0, 0.3);
            border-color: #006400;
            color: #90ee90;
        }

    </style>
</head>
<body>

    <div class="game-header">
        <h1 class="game-title">
            <img src="/Assets/interface/cockFighterTitulo.png" alt="Cock Fighters" style="height: 100px;">
        </h1>
    </div>

    <div class="main-container">
        <div class="info-section">
            <h2 class="welcome-text">Bienvenido Gallero!</h2>
            <p class="description">
                Cock Fighter es un juego donde puedes combatir en línea en épicas peleas.
            </p>

            <ul class="features-list">
                <li>Crea a tu entrenador </li>
                <li>Selecciona tu equipo</li>
                <li>Pelea con jugadores reales</li>
            </ul>
        </div>

        <div class="form-section-container">
            <div class="login-card">

                <div id="alertContainer"></div>

                <div class="form-tabs">
                    <button class="tab-btn active" onclick="showTab('login')">Iniciar Sesión</button>
                    <button class="tab-btn" onclick="showTab('register')">Registrarse</button>
                </div>

                <!-- FORM LOGIN -->
                <div id="loginForm" class="form-section active">
                    <label class="form-label">Usuario o Email</label>
                    <input type="text" class="form-control" id="loginUsername">

                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="loginPassword">

                    <button class="btn btn-primary" onclick="login()">Entrar al Juego</button>
                </div>

                <!-- FORM REGISTRO -->
                <div id="registerForm" class="form-section">
                    <label class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="registerUsername">

                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="registerEmail">

                    <label class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="registerPassword">

                    <label class="form-label">Confirmar Contraseña</label>
                    <input type="password" class="form-control" id="registerConfirmPassword">

                    <button class="btn btn-primary" onclick="register()">Crear Cuenta</button>
                </div>

            </div>
        </div>
    </div>

<script>

const API_URL = "/api/auth";

function showAlert(message, type = "danger") {
    document.getElementById("alertContainer").innerHTML = `
        <div class="alert alert-${type}">${message}</div>
    `;
}

// login
async function login() {
    const emailOrUsername = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value.trim();

    if (!emailOrUsername || !password)
        return showAlert("Debes llenar todos los campos.");

    try {
        const res = await fetch(`${API_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ emailOrUsername, password })
        });

        const data = await res.json();

        if (!res.ok) return showAlert(data.message);

        localStorage.setItem("token", data.token);
        localStorage.setItem("userId", data._id);

        showAlert("Inicio de sesión exitoso!", "success");

        setTimeout(() => window.location.href = "/views/menuP.html", 800);

    } catch (e) {
        showAlert("Error al conectar con el servidor.");
    }
}

// registro
async function register() {
    const username = document.getElementById("registerUsername").value.trim();
    const email = document.getElementById("registerEmail").value.trim();
    const password = document.getElementById("registerPassword").value.trim();
    const confirm = document.getElementById("registerConfirmPassword").value.trim();

    if (!username || !email || !password || !confirm)
        return showAlert("Completa todos los campos.");

    if (password !== confirm)
        return showAlert("Las contraseñas no coinciden.");

    try {
        const res = await fetch(`${API_URL}/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password })
        });

        const data = await res.json();

        if (!res.ok) return showAlert(data.message);

        showAlert("Registro exitoso, inicia sesión.", "success");

        showTab("login");

    } catch (e) {
        showAlert("Error al registrar.");
    }
}

//cambiar de pestañas
function showTab(tab) {
    document.getElementById("alertContainer").innerHTML = "";

    document.getElementById("loginForm").classList.toggle("active", tab === "login");
    document.getElementById("registerForm").classList.toggle("active", tab === "register");

    const buttons = document.querySelectorAll(".tab-btn");
    buttons[0].classList.toggle("active", tab === "login");
    buttons[1].classList.toggle("active", tab === "register");
}

</script>
</body>
</html>
