<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pago exitoso</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    a {
      color: #ff6b35;
      margin-top: 20px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Pago exitoso</h1>
  <p id="statusText">Procesando verificación de pago...</p>
  <a id="backLink" href="/tienda.html" style="display:none;">Volver a la tienda</a>

  <script>
    async function finalizePurchase() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      if (!sessionId) {
        document.getElementById('statusText').textContent = 'No se encontró session_id en la URL.';
        document.getElementById('backLink').style.display = 'inline-block';
        return;
      }

      try {
        const res = await fetch(`/checkout-session?sessionId=${encodeURIComponent(sessionId)}`);
        const data = await res.json();
        if (!res.ok) {
          document.getElementById('statusText').textContent = data.message || 'Error al verificar la compra.';
          document.getElementById('backLink').style.display = 'inline-block';
          return;
        }

        document.getElementById('statusText').textContent = data.message || 'Compra procesada con éxito.';
        document.getElementById('backLink').style.display = 'inline-block';
      } catch (err) {
        console.error(err);
        document.getElementById('statusText').textContent = 'Error al conectar con el servidor para finalizar la compra.';
        document.getElementById('backLink').style.display = 'inline-block';
      }
    }

    finalizePurchase();
  </script>
</body>
</html>
